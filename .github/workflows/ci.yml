name: CI

# Runs on every push and every pull request to main. The point is narrow: nothing
# reaches production that fails typecheck, lint, the unit suite, or the build.
#
# The SQL job applies EVERY migration and runs every SQL assertion against a real
# PostgreSQL. That is broader than it used to be, and deliberately: it applied two
# migrations and ran two test files, so 013 through 036 were never executed here at
# all. A migration Postgres rejects then reaches the Supabase SQL editor before anyone
# finds out, which is how 032 shipped with an index on `checked_at::date` (STABLE, not
# IMMUTABLE, refused outright).
#
# The list lives in test/sql/suite.sh, which the local runner also uses. Two lists that
# are supposed to agree will not.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        # Supabase and Stripe are read at request time, not at build time, but the
        # client bundle needs the public URL to exist for the build to resolve.
        # These are placeholders: no real key belongs in CI.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key
        run: npm run build

  sql:
    name: Migrations and SQL assertions against PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply every migration and run every SQL assertion
        env:
          PGPASSWORD: postgres
          # The same script the local runner uses, pointed at the service container
          # instead of a throwaway server. One list, not two.
          PSQL: psql -h localhost -U postgres
        run: ./test/sql/suite.sh

  guard:
    name: No secrets, no typographic dashes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Reject real credentials in tracked files
        # .env.local is gitignored; this catches a real key pasted into the tracked
        # template or anywhere else, which has happened before.
        run: |
          # Each token is written with a bracketed letter so the pattern matches a
          # real credential but not this file, which would otherwise fail every run.
          if git grep -nIE 'sk_[l]ive_|sk_[t]est_[A-Za-z0-9]{20,}|whs[e]c_[A-Za-z0-9]{20,}|S[G]\.[A-Za-z0-9_-]{20,}' -- . ':!*.md'; then
            echo "A real looking credential is committed. Move it to .env.local."
            exit 1
          fi
          echo "no credentials found in tracked files"

      - name: Reject typographic dashes
        run: |
          # Written as escapes so this check does not match its own source.
          if git grep -nIP '\x{2014}|\x{2013}' -- . ':!package-lock.json'; then
            echo "Use ordinary punctuation instead of em and en dashes."
            exit 1
          fi
          echo "no typographic dashes found"
